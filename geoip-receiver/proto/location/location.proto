syntax = "proto3";

package location;

option go_package = "geoip-receiver/proto/location";

message LocationPayload {
  string id        = 1;
  double lat       = 2;
  double lon       = 3;
  int64  timestamp = 4;
}

message Ack {
  bool ok = 1;
}

service LocationReceiver {
  rpc Stream(stream LocationPayload) returns (stream Ack);
}
